<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <title>simon say game</title>
        <link rel="stylesheet" href="style.css" />
    </head>
  <body>
    
	<div class="game-container">
        <h1>Simon Says </h1>
        <h2>Press any key to start the game</h2>
        <h3 id="high-score">High-Score: 0</h3>
        <div class="btn-container">
        <div class="line-one">
            <div class="btn red" id="red"></div>
        <div class="btn yellow" id="yellow"></div>
        </div>
        <div class="line-two">
           <div class="btn blue" id="blue"></div>
        <div class="btn green" id="green"></div>
          </div>
        </div>
          
		<p class="instructions">
      Watch the pattern • Remember the sequence • Repeat it
    </p>

  </div>
        <script src="app.js"></script>
    </body>
</html>
